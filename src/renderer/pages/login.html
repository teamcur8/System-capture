<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo - Smart Real Time Call Recorder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f7f7fb 0%, #eeeafd 100%);
            color: #2a2253;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            width: 450px;
            padding: 40px;
            text-align: center;
        }

        .logo-section {
            margin-bottom: 30px;
        }

        .logo {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #a48ae6 0%, #7e60d6 100%);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
            animation: rotate 3s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            color: #2a2253;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #a48ae6;
            margin-bottom: 30px;
        }

        .welcome-text {
            font-size: 18px;
            font-weight: bold;
            color: #2a2253;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 12px;
            color: #a48ae6;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e4dbfa;
            border-radius: 10px;
            font-size: 14px;
            background: #f7f7fb;
            color: #2a2253;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #a48ae6;
            background: white;
            box-shadow: 0 0 0 3px rgba(164, 138, 230, 0.1);
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: #a48ae6;
            text-decoration: none;
            font-size: 12px;
            cursor: pointer;
        }

        .forgot-password a:hover {
            color: #7e60d6;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: #a48ae6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .login-btn:hover {
            background: #7e60d6;
            transform: translateY(-2px);
        }

        .login-btn:disabled {
            background: #e4dbfa;
            cursor: not-allowed;
            transform: none;
        }

        .status-message {
            font-size: 14px;
            margin-bottom: 15px;
            min-height: 20px;
        }

        .status-message.error {
            color: #ea3c53;
        }

        .status-message.success {
            color: #54d88f;
        }

        .status-message.info {
            color: #7e60d6;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #f7f7fb;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 20px;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #a48ae6, #7e60d6);
            width: 0%;
            animation: progress 2s ease-in-out infinite;
        }

        @keyframes progress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #a48ae6;
        }

        .version {
            font-size: 10px;
            color: #999;
            margin-top: 5px;
        }

        .invalid-credentials {
            color: #ea3c53;
            font-size: 12px;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <div class="logo">🎤</div>
            <h1 class="title">Echo - Call Recorder</h1>
            <p class="subtitle">Professional Call Management System</p>
        </div>

        <div class="welcome-text">Welcome!</div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
            </div>

            <div class="invalid-credentials" id="invalidCredentials">
                Incorrect email or password.
            </div>

            <div class="forgot-password">
                <a href="#" onclick="openForgotPassword()">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">Sign In</button>

            <div class="status-message" id="statusMessage"></div>

            <div class="progress-bar" id="progressBar">
                <div class="progress-fill"></div>
            </div>
        </form>

        <div class="footer">
            <div>Secure • Professional • Reliable</div>
            <div class="version">v1.0</div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
