<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Streamer v1.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            overflow-y: auto;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header {
            text-align: center;
            margin: 16px 0 6px;
        }

        .header h1 { display: none; }

        .header p { display: none; }

        .user-info {
            margin-top: 0;
            padding: 8px 6px 0;
        }

        .user-name {
            display: block;
            font-size: 1.05em;
            font-weight: bold;
            color: #111827;
            margin-bottom: 5px;
        }

        .user-email {
            display: block;
            font-size: 0.9em;
            color: #6b7280;
        }

        .main-content {
            background: #ffffff;
            border-radius: 14px;
            padding: 0 24px 28px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.12);
            width: 820px;
            max-width: 100%;
        }

        .card-header {
            background: #23284c;
            color: #fff;
            border-radius: 14px 14px 0 0;
            padding: 18px 24px;
            text-align: center;
            font-weight: 800;
            font-size: 24px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin: 18px 0 22px;
        }

        .status-card {
            background: #eff1fb;
            border-radius: 12px;
            padding: 16px 12px;
            text-align: center;
            border-left: 0;
            transition: all 0.25s ease;
        }

        .status-card.active { background: #e3f6ea; box-shadow: inset 0 0 0 2px #28a74522; }

        .status-card.inactive { background: #eef0f7; }

        .status-card h3 { margin-bottom: 6px; color: #111827; }

        .status-indicator {
            display: none;
        }

        .status-text {
            font-weight: bold;
            font-size: 1.1em;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 110px;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #1e7e34;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        .btn-warning {
            background: #ffc107;
            color: #212529;
        }

        .btn-warning:hover {
            background: #e0a800;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .btn-info {
            background: #17a2b8;
            color: white;
        }

        .btn-info:hover {
            background: #138496;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Stats and logs removed for simplified UI */

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }
            
            .main-content {
                padding: 0 16px 16px;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            .status-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-content">
            <div class="header">
                <h1>Echo - Audio Streamer</h1>
                <p>Real-time microphone and system audio streaming</p>
                <div class="user-info" id="userInfo">
                    <span class="user-name" id="userName">Welcome!</span>
                    <span class="user-email" id="userEmail"></span>
                </div>
            </div>
            <div class="status-grid">
                <div class="status-card" id="mic-status">
                    <h3>Microphone</h3>
                    <div class="status-text" id="mic-text">Inactive</div>
                </div>
                
                <div class="status-card" id="system-status">
                    <h3>System Audio</h3>
                    <div class="status-text" id="system-text">Inactive</div>
                </div>
                
                <div class="status-card" id="websocket-status">
                    <h3>Echo</h3>
                    <div class="status-text" id="websocket-text">Disconnected</div>
                </div>
                
                <div class="status-card" id="streaming-status">
                    <h3>Streaming</h3>
                    <div class="status-text" id="streaming-text">Inactive</div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-success" id="start-btn">Start</button>
                <button class="btn btn-danger" id="stop-btn" disabled>Stop</button>
                <button class="btn btn-secondary" id="logout-btn">Logout</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
