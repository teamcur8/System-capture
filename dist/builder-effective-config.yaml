directories:
  output: dist
  buildResources: build
appId: com.echo.audiostreamer
productName: Echo - Audio Streamer
files:
  - filter:
      - src/**/*
      - build/Release/wasapi_capture.node
      - node_modules/**/*
      - package.json
      - LICENSE.txt
extraResources:
  - from: build/Release/wasapi_capture.node
    to: wasapi_capture.node
win:
  target:
    - target: portable
      arch:
        - x64
  sign: false
  signAndEditExecutable: false
  artifactName: Echo-Audio-Streamer-Portable-${version}.${ext}
  certificateFile: null
  certificatePassword: <stripped sensitive data>
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Echo Audio Streamer
  perMachine: true
  deleteAppDataOnUninstall: false
electronVersion: 28.3.3
